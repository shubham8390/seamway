<section id="contact" class="section-padding bg-navy-900 text-white">
  <div class="container-max">
    <div appScrollAnimate class="text-center mb-12 lg:mb-16">
      <p class="text-brand-orange font-heading font-bold uppercase tracking-widest text-sm mb-2">Reach Out</p>
      <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold uppercase">GET IN TOUCH</h2>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 items-start">
      <div appScrollAnimate class="space-y-6 sm:space-y-8 order-2 lg:order-1">
        <div>
          <h3 class="font-heading font-bold uppercase text-brand-orange text-sm mb-3 tracking-wider">Phone</h3>
          <ul class="space-y-2">
            @for (phone of content.contact.phones; track phone) {
              <li>
                <a [href]="phoneHref(phone)" class="text-lg hover:text-brand-orange transition-colors">
                  {{ phone }}
                </a>
              </li>
            }
          </ul>
        </div>

        <div>
          <h3 class="font-heading font-bold uppercase text-brand-orange text-sm mb-3 tracking-wider">Email</h3>
          <a
            [href]="'mailto:' + content.contact.email"
            class="text-lg hover:text-brand-orange transition-colors break-all"
          >
            {{ content.contact.email }}
          </a>
        </div>

        <div>
          <h3 class="font-heading font-bold uppercase text-brand-orange text-sm mb-3 tracking-wider">Website</h3>
          <a
            href="https://www.seamwaylogistics.com"
            target="_blank"
            rel="noopener noreferrer"
            class="text-lg hover:text-brand-orange transition-colors"
          >
            {{ content.contact.website }}
          </a>
        </div>

        <div>
          <h3 class="font-heading font-bold uppercase text-brand-orange text-sm mb-3 tracking-wider">Location</h3>
          <p class="text-lg text-gray-300">{{ content.contact.location }}</p>
        </div>

        <div class="flex gap-4 pt-2">
          <a
            href="#"
            aria-label="LinkedIn"
            class="flex items-center justify-center min-w-[44px] min-h-[44px] rounded-lg bg-navy-800 hover:bg-brand-orange transition-colors"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          </a>
          <a
            href="#"
            aria-label="Twitter"
            class="flex items-center justify-center min-w-[44px] min-h-[44px] rounded-lg bg-navy-800 hover:bg-brand-orange transition-colors"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
        </div>
      </div>

      <div appScrollAnimate [delay]="200" class="order-1 lg:order-2">
        <app-contact-form />
      </div>
    </div>
  </div>
</section>
