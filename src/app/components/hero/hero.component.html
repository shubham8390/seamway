<section id="home" class="relative min-h-[100svh] flex items-center overflow-hidden">
  <div class="absolute inset-0">
    <img
      src="/assets/images/hero-logistics.jpg"
      alt="Global logistics - ships, planes and cargo"
      class="w-full h-full object-cover"
      loading="eager"
    />
    <div class="absolute inset-0 bg-gradient-to-r from-navy-900/95 via-navy-900/80 to-navy-900/60 sm:to-navy-900/40"></div>
  </div>

  <div class="relative container-max py-24 sm:py-28 lg:py-32 w-full">
    <p class="text-brand-orange font-heading font-semibold uppercase tracking-[0.2em] text-sm sm:text-base mb-4 animate-fade-in">
      {{ content.tagline }}
    </p>

    <div class="space-y-2 sm:space-y-3 mb-6">
      @for (headline of content.heroHeadlines; track headline; let i = $index) {
        <h1
          class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl xl:text-6xl font-extrabold uppercase leading-tight tracking-wide animate-fade-up"
          [style.animation-delay.ms]="i * 150"
          [class.text-brand-orange]="i === 0"
          [class.text-white]="i !== 0"
        >
          {{ headline }}
        </h1>
      }
    </div>

    <p
      class="text-base sm:text-lg lg:text-xl text-gray-200 max-w-2xl mb-8 sm:mb-10 animate-fade-up"
      style="animation-delay: 500ms"
    >
      {{ content.heroSubtext }}
    </p>

    <div class="flex flex-wrap gap-3 sm:gap-4 mb-10 sm:mb-12 animate-fade-up" style="animation-delay: 650ms">
      @for (service of content.heroServices; track service.label) {
        <div
          class="flex items-center gap-2 px-3 sm:px-4 py-2 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 text-white text-xs sm:text-sm font-medium"
        >
          <span class="w-2 h-2 rounded-full bg-brand-orange flex-shrink-0"></span>
          {{ service.label }}
        </div>
      }
    </div>

    <a
      href="#who-we-are"
      class="btn-primary animate-fade-up"
      style="animation-delay: 800ms"
    >
      Discover Seamway
      <svg class="w-5 h-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
      </svg>
    </a>
  </div>
</section>
