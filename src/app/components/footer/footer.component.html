<footer class="bg-navy-900 text-gray-300 border-t border-navy-700">
  <div class="container-max py-8 sm:py-10">
    <div class="text-center space-y-3">
      <p class="text-brand-orange font-heading font-bold uppercase tracking-widest text-sm">
        {{ content.footerTagline }}
      </p>
      <p class="text-sm text-gray-400">
        &copy; {{ year }} {{ content.companyName }}. All rights reserved.
      </p>
      <a
        href="https://www.seamwaylogistics.com"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-block text-sm text-gray-400 hover:text-brand-orange transition-colors"
      >
        {{ content.contact.website }}
      </a>
    </div>
  </div>
</footer>
